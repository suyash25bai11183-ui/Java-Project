<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="560" fill="#ffffff"/>
  <defs>
    <marker id="u" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L8,2.5 z" fill="#64748b"/>
    </marker>
    <g id="actor">
      <circle cx="0" cy="-26" r="9" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
      <line x1="0" y1="-17" x2="0" y2="4" stroke="#334155" stroke-width="1.6"/>
      <line x1="-12" y1="-9" x2="12" y2="-9" stroke="#334155" stroke-width="1.6"/>
      <line x1="0" y1="4" x2="-10" y2="20" stroke="#334155" stroke-width="1.6"/>
      <line x1="0" y1="4" x2="10" y2="20" stroke="#334155" stroke-width="1.6"/>
    </g>
  </defs>

  <!-- System boundary -->
  <rect x="215" y="30" width="270" height="500" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="350" y="52" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">ClubGear System</text>

  <!-- Use cases -->
  <ellipse cx="350" cy="82" rx="110" ry="18" fill="#eff6ff" stroke="#2563eb"/>
  <text x="350" y="87" font-size="11" text-anchor="middle" fill="#1e3a8a">Add club</text>

  <ellipse cx="350" cy="122" rx="110" ry="18" fill="#eff6ff" stroke="#2563eb"/>
  <text x="350" y="127" font-size="11" text-anchor="middle" fill="#1e3a8a">Register member</text>

  <ellipse cx="350" cy="162" rx="110" ry="18" fill="#eff6ff" stroke="#2563eb"/>
  <text x="350" y="167" font-size="11" text-anchor="middle" fill="#1e3a8a">Add equipment</text>

  <ellipse cx="350" cy="202" rx="110" ry="18" fill="#eff6ff" stroke="#2563eb"/>
  <text x="350" y="207" font-size="11" text-anchor="middle" fill="#1e3a8a">View / search records</text>

  <ellipse cx="350" cy="242" rx="110" ry="18" fill="#dcfce7" stroke="#16a34a"/>
  <text x="350" y="247" font-size="11" text-anchor="middle" fill="#14532d">Create booking</text>

  <ellipse cx="350" cy="282" rx="110" ry="18" fill="#dcfce7" stroke="#16a34a"/>
  <text x="350" y="287" font-size="11" text-anchor="middle" fill="#14532d">Approve booking</text>

  <ellipse cx="350" cy="322" rx="110" ry="18" fill="#dcfce7" stroke="#16a34a"/>
  <text x="350" y="327" font-size="11" text-anchor="middle" fill="#14532d">Cancel booking</text>

  <ellipse cx="350" cy="362" rx="110" ry="18" fill="#dcfce7" stroke="#16a34a"/>
  <text x="350" y="367" font-size="11" text-anchor="middle" fill="#14532d">Issue equipment</text>

  <ellipse cx="350" cy="402" rx="110" ry="18" fill="#dcfce7" stroke="#16a34a"/>
  <text x="350" y="407" font-size="11" text-anchor="middle" fill="#14532d">Return equipment</text>

  <ellipse cx="350" cy="442" rx="110" ry="18" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="350" y="447" font-size="11" text-anchor="middle" fill="#713f12">Manage maintenance</text>

  <ellipse cx="350" cy="482" rx="110" ry="18" fill="#fce7f3" stroke="#db2777"/>
  <text x="350" y="487" font-size="11" text-anchor="middle" fill="#831843">View reports</text>

  <ellipse cx="350" cy="514" rx="110" ry="16" fill="#fce7f3" stroke="#db2777"/>
  <text x="350" y="519" font-size="11" text-anchor="middle" fill="#831843">Save / load data</text>

  <!-- Coordinator (left) -->
  <g transform="translate(70,120)"><use href="#actor"/></g>
  <text x="70" y="160" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Club Coordinator</text>
  <line x1="88" y1="112" x2="240" y2="84" stroke="#64748b" marker-end="url(#u)"/>
  <line x1="88" y1="115" x2="240" y2="123" stroke="#64748b" marker-end="url(#u)"/>
  <line x1="88" y1="118" x2="240" y2="162" stroke="#64748b" marker-end="url(#u)"/>
  <line x1="88" y1="124" x2="240" y2="282" stroke="#64748b" marker-end="url(#u)"/>
  <line x1="88" y1="128" x2="240" y2="322" stroke="#64748b" marker-end="url(#u)"/>
  <line x1="88" y1="132" x2="240" y2="362" stroke="#64748b" marker-end="url(#u)"/>
  <line x1="88" y1="136" x2="243" y2="480" stroke="#64748b" marker-end="url(#u)"/>
  <line x1="88" y1="140" x2="243" y2="512" stroke="#64748b" marker-end="url(#u)"/>

  <!-- Member (right top) -->
  <g transform="translate(620,180)"><use href="#actor"/></g>
  <text x="620" y="220" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Club Member</text>
  <line x1="604" y1="170" x2="461" y2="202" stroke="#64748b" marker-end="url(#u)"/>
  <line x1="604" y1="176" x2="461" y2="242" stroke="#64748b" marker-end="url(#u)"/>
  <line x1="604" y1="182" x2="461" y2="400" stroke="#64748b" marker-end="url(#u)"/>

  <!-- Equipment in-charge (right bottom) -->
  <g transform="translate(620,400)"><use href="#actor"/></g>
  <text x="620" y="440" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Equipment In-charge</text>
  <line x1="604" y1="392" x2="461" y2="404" stroke="#64748b" marker-end="url(#u)"/>
  <line x1="604" y1="398" x2="461" y2="442" stroke="#64748b" marker-end="url(#u)"/>
  <line x1="604" y1="386" x2="461" y2="205" stroke="#64748b" marker-end="url(#u)"/>
</svg>
