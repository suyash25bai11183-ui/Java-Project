<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="520" fill="#ffffff"/>

  <!-- User -->
  <ellipse cx="350" cy="30" rx="150" ry="20" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="35" font-size="13" text-anchor="middle" fill="#78350f">User: Club Coordinator / Club Member</text>
  <line x1="350" y1="50" x2="350" y2="76" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="360" y="68" font-size="10" fill="#475569">types menu choices</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto">
      <path d="M9,0 L9,6 L0,3 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Presentation layer -->
  <rect x="30" y="80" width="640" height="95" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="45" y="99" font-size="12" font-weight="bold" fill="#1d4ed8">PRESENTATION LAYER</text>
  <rect x="55" y="108" width="175" height="52" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="142" y="127" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Main.java</text>
  <text x="142" y="143" font-size="10" text-anchor="middle" fill="#334155">entry point, banner, Scanner</text>
  <rect x="250" y="108" width="200" height="52" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="350" y="127" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">ClubGearSystem.java</text>
  <text x="350" y="143" font-size="10" text-anchor="middle" fill="#334155">menu loop + one method per operation</text>
  <rect x="470" y="108" width="175" height="52" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="557" y="127" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">InputValidator.java</text>
  <text x="557" y="143" font-size="10" text-anchor="middle" fill="#334155">safe input + validation</text>
  <line x1="230" y1="134" x2="248" y2="134" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="452" y1="134" x2="468" y2="134" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="452" y1="146" x2="468" y2="146" stroke="#475569" stroke-width="1.5" marker-start="url(#arb)"/>

  <line x1="350" y1="175" x2="350" y2="203" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="360" y="194" font-size="10" fill="#475569">creates and reads objects</text>

  <!-- Domain layer -->
  <rect x="30" y="207" width="640" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="45" y="226" font-size="12" font-weight="bold" fill="#15803d">DOMAIN / BUSINESS LOGIC LAYER</text>

  <rect x="55" y="236" width="130" height="44" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="120" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">Club</text>
  <text x="120" y="270" font-size="9" text-anchor="middle" fill="#334155">id, name, coordinator</text>

  <rect x="200" y="236" width="130" height="44" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="265" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">Member</text>
  <text x="265" y="270" font-size="9" text-anchor="middle" fill="#334155">id, email, course, year</text>

  <rect x="345" y="236" width="140" height="44" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="415" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">Equipment</text>
  <text x="415" y="270" font-size="9" text-anchor="middle" fill="#334155">qty, condition, status</text>

  <rect x="500" y="236" width="145" height="44" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="572" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">Booking</text>
  <text x="572" y="270" font-size="9" text-anchor="middle" fill="#334155">dates + overlap rule</text>

  <rect x="55" y="295" width="175" height="44" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="142" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">MaintenanceRecord</text>
  <text x="142" y="329" font-size="9" text-anchor="middle" fill="#334155">equipment repair history</text>

  <rect x="250" y="295" width="185" height="44" rx="5" fill="#fefce8" stroke="#ca8a04"/>
  <text x="342" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="#713f12">BookingStatus (enum)</text>
  <text x="342" y="329" font-size="9" text-anchor="middle" fill="#334155">REQUESTED ... OVERDUE</text>

  <rect x="455" y="295" width="190" height="44" rx="5" fill="#fefce8" stroke="#ca8a04"/>
  <text x="550" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="#713f12">EquipmentStatus (enum)</text>
  <text x="550" y="329" font-size="9" text-anchor="middle" fill="#334155">AVAILABLE ... UNDER_MAINTENANCE</text>

  <line x1="350" y1="357" x2="350" y2="385" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="360" y="376" font-size="10" fill="#475569">toCsvLine() / fromCsvLine()</text>

  <!-- Persistence layer -->
  <rect x="30" y="389" width="640" height="112" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="45" y="408" font-size="12" font-weight="bold" fill="#be185d">PERSISTENCE LAYER</text>

  <rect x="70" y="420" width="220" height="60" rx="5" fill="#ffffff" stroke="#db2777"/>
  <text x="180" y="443" font-size="12" font-weight="bold" text-anchor="middle" fill="#831843">FileStorage.java</text>
  <text x="180" y="459" font-size="10" text-anchor="middle" fill="#334155">writeLines() / readLines()</text>
  <text x="180" y="472" font-size="10" text-anchor="middle" fill="#334155">missing file returns empty list</text>

  <line x1="290" y1="443" x2="395" y2="443" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="290" y1="459" x2="395" y2="459" stroke="#475569" stroke-width="1.5" marker-start="url(#arb)"/>

  <path d="M400,425 a55,10 0 0,1 110,0 v45 a55,10 0 0,1 -110,0 z" fill="#ffffff" stroke="#db2777"/>
  <path d="M400,425 a55,10 0 0,0 110,0" fill="none" stroke="#db2777"/>
  <text x="455" y="452" font-size="11" font-weight="bold" text-anchor="middle" fill="#831843">data/*.csv</text>
  <text x="455" y="467" font-size="9" text-anchor="middle" fill="#334155">5 text files</text>

  <text x="530" y="437" font-size="9" fill="#475569">clubs.csv</text>
  <text x="530" y="450" font-size="9" fill="#475569">members.csv</text>
  <text x="530" y="463" font-size="9" fill="#475569">equipment.csv</text>
  <text x="600" y="437" font-size="9" fill="#475569">bookings.csv</text>
  <text x="600" y="450" font-size="9" fill="#475569">maintenance.csv</text>
</svg>
