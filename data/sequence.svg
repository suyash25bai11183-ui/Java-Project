<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 660" width="700" height="660" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="660" fill="#ffffff"/>
  <defs>
    <marker id="s" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e3a8a"/>
    </marker>
    <marker id="sr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- Participant heads -->
  <rect x="15" y="15" width="100" height="34" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="65" y="37" font-size="11" font-weight="bold" text-anchor="middle" fill="#78350f">Club Member</text>

  <rect x="140" y="15" width="120" height="34" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="200" y="37" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e3a8a">ClubGearSystem</text>

  <rect x="290" y="15" width="110" height="34" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="345" y="37" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e3a8a">InputValidator</text>

  <rect x="425" y="15" width="100" height="34" rx="4" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="475" y="37" font-size="11" font-weight="bold" text-anchor="middle" fill="#14532d">Equipment</text>

  <rect x="555" y="15" width="130" height="34" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="620" y="31" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Booking</text>
  <text x="620" y="44" font-size="9" text-anchor="middle" fill="#334155">existing + new</text>

  <!-- Lifelines -->
  <line x1="65" y1="49" x2="65" y2="620" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <line x1="200" y1="49" x2="200" y2="620" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <line x1="345" y1="49" x2="345" y2="620" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <line x1="475" y1="49" x2="475" y2="620" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <line x1="620" y1="49" x2="620" y2="620" stroke="#94a3b8" stroke-dasharray="5 4"/>

  <!-- Activation bar on system -->
  <rect x="194" y="70" width="12" height="520" fill="#dbeafe" stroke="#2563eb"/>

  <!-- 1 -->
  <line x1="65" y1="76" x2="192" y2="76" stroke="#1e3a8a" stroke-width="1.4" marker-end="url(#s)"/>
  <text x="70" y="70" font-size="9.5" fill="#1e3a8a">1: chooses menu option 6</text>

  <!-- 2 self -->
  <path d="M206,96 h34 v18 h-34" fill="none" stroke="#1e3a8a" stroke-width="1.3" marker-end="url(#s)"/>
  <text x="246" y="104" font-size="9.5" fill="#1e3a8a">2: printMembers(), printEquipment()</text>

  <!-- 3 -->
  <line x1="206" y1="134" x2="343" y2="134" stroke="#1e3a8a" stroke-width="1.4" marker-end="url(#s)"/>
  <text x="212" y="128" font-size="9.5" fill="#1e3a8a">3: readId("Enter member ID")</text>
  <line x1="343" y1="152" x2="208" y2="152" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sr)"/>
  <text x="240" y="147" font-size="9.5" fill="#15803d">"MEM003"</text>

  <!-- 4 -->
  <line x1="206" y1="176" x2="343" y2="176" stroke="#1e3a8a" stroke-width="1.4" marker-end="url(#s)"/>
  <text x="212" y="170" font-size="9.5" fill="#1e3a8a">4: readId("Enter equipment ID")</text>
  <line x1="343" y1="194" x2="208" y2="194" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sr)"/>
  <text x="240" y="189" font-size="9.5" fill="#15803d">"EQP004"</text>

  <!-- 5 -->
  <line x1="206" y1="218" x2="473" y2="218" stroke="#1e3a8a" stroke-width="1.4" marker-end="url(#s)"/>
  <text x="212" y="212" font-size="9.5" fill="#1e3a8a">5: isBookable()</text>
  <line x1="473" y1="236" x2="208" y2="236" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sr)"/>
  <text x="380" y="231" font-size="9.5" fill="#15803d">true</text>

  <!-- 6 dates -->
  <line x1="206" y1="260" x2="343" y2="260" stroke="#1e3a8a" stroke-width="1.4" marker-end="url(#s)"/>
  <text x="212" y="254" font-size="9.5" fill="#1e3a8a">6: readDate("start"), readDate("return")</text>
  <line x1="343" y1="278" x2="208" y2="278" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sr)"/>
  <text x="222" y="273" font-size="9.5" fill="#15803d">2026-09-20, 2026-09-22</text>

  <!-- 7 self check -->
  <path d="M206,298 h34 v18 h-34" fill="none" stroke="#1e3a8a" stroke-width="1.3" marker-end="url(#s)"/>
  <text x="246" y="306" font-size="9.5" fill="#1e3a8a">7: check returnDate is not before startDate</text>

  <!-- loop box -->
  <rect x="180" y="332" width="480" height="122" rx="4" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5 3"/>
  <rect x="180" y="332" width="150" height="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="188" y="345" font-size="9.5" font-weight="bold" fill="#5b21b6">loop  [every booking of EQP004]</text>

  <line x1="206" y1="372" x2="618" y2="372" stroke="#1e3a8a" stroke-width="1.4" marker-end="url(#s)"/>
  <text x="212" y="366" font-size="9.5" fill="#1e3a8a">8: isBlockingEquipment()</text>
  <line x1="618" y1="390" x2="208" y2="390" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sr)"/>
  <text x="500" y="385" font-size="9.5" fill="#15803d">true / false</text>

  <line x1="206" y1="414" x2="618" y2="414" stroke="#1e3a8a" stroke-width="1.4" marker-end="url(#s)"/>
  <text x="212" y="408" font-size="9.5" fill="#1e3a8a">9: overlapsWith(2026-09-20, 2026-09-22)</text>
  <line x1="618" y1="432" x2="208" y2="432" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sr)"/>
  <text x="500" y="427" font-size="9.5" fill="#15803d">false  (no clash)</text>

  <!-- alt note -->
  <rect x="180" y="464" width="480" height="30" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="190" y="483" font-size="9.5" fill="#991b1b">alt [clash found] → the error names the clashing booking; no Booking object is created</text>

  <!-- 10 purpose -->
  <line x1="206" y1="514" x2="343" y2="514" stroke="#1e3a8a" stroke-width="1.4" marker-end="url(#s)"/>
  <text x="212" y="508" font-size="9.5" fill="#1e3a8a">10: readNonEmptyText("Purpose")</text>
  <line x1="343" y1="530" x2="208" y2="530" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sr)"/>
  <text x="222" y="525" font-size="9.5" fill="#15803d">"Fest photography"</text>

  <!-- 11 create -->
  <line x1="206" y1="554" x2="618" y2="554" stroke="#1e3a8a" stroke-width="1.4" marker-end="url(#s)"/>
  <text x="212" y="548" font-size="9.5" fill="#1e3a8a">11: new Booking(BKG004, ..., REQUESTED)</text>
  <rect x="614" y="554" width="12" height="36" fill="#dbeafe" stroke="#2563eb"/>

  <!-- 12 confirmation -->
  <line x1="192" y1="590" x2="67" y2="590" stroke="#15803d" stroke-width="1.4" marker-end="url(#sr)"/>
  <text x="72" y="584" font-size="9.5" fill="#15803d">12: BOOKING CONFIRMATION (BKG004, REQUESTED)</text>

  <text x="350" y="640" font-size="10" text-anchor="middle" fill="#64748b">Sequence: creating an equipment booking (menu option 6)</text>
</svg>
