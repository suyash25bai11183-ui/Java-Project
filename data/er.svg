<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="700" height="620" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="620" fill="#ffffff"/>

  <!-- CLUB -->
  <rect x="250" y="20" width="200" height="118" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <rect x="250" y="20" width="200" height="24" rx="4" fill="#2563eb"/>
  <text x="350" y="37" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">CLUB  (clubs.csv)</text>
  <text x="258" y="60" font-size="10" fill="#0f172a" font-weight="bold">clubId</text>
  <text x="410" y="60" font-size="9" fill="#2563eb" text-anchor="end">PK</text>
  <text x="258" y="76" font-size="10" fill="#334155">name</text>
  <text x="410" y="76" font-size="9" fill="#16a34a" text-anchor="end">UNIQUE</text>
  <text x="258" y="92" font-size="10" fill="#334155">coordinatorName</text>
  <text x="258" y="108" font-size="10" fill="#334155">category</text>
  <text x="258" y="128" font-size="9" fill="#64748b">format CLB001, CLB002, ...</text>

  <!-- MEMBER -->
  <rect x="20" y="215" width="200" height="132" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="20" y="215" width="200" height="24" rx="4" fill="#16a34a"/>
  <text x="120" y="232" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">MEMBER  (members.csv)</text>
  <text x="28" y="255" font-size="10" font-weight="bold" fill="#0f172a">memberId</text>
  <text x="180" y="255" font-size="9" fill="#2563eb" text-anchor="end">PK</text>
  <text x="28" y="271" font-size="10" fill="#334155">name</text>
  <text x="28" y="287" font-size="10" fill="#334155">email</text>
  <text x="180" y="287" font-size="9" fill="#16a34a" text-anchor="end">UNIQUE</text>
  <text x="28" y="303" font-size="10" fill="#334155">course, year</text>
  <text x="28" y="319" font-size="10" fill="#334155">clubId</text>
  <text x="180" y="319" font-size="9" fill="#db2777" text-anchor="end">FK</text>
  <text x="28" y="338" font-size="9" fill="#64748b">format MEM001, MEM002, ...</text>

  <!-- EQUIPMENT -->
  <rect x="480" y="215" width="200" height="132" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="480" y="215" width="200" height="24" rx="4" fill="#16a34a"/>
  <text x="580" y="232" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">EQUIPMENT (equipment.csv)</text>
  <text x="488" y="255" font-size="10" font-weight="bold" fill="#0f172a">equipmentId</text>
  <text x="640" y="255" font-size="9" fill="#2563eb" text-anchor="end">PK</text>
  <text x="488" y="271" font-size="10" fill="#334155">name, category</text>
  <text x="488" y="287" font-size="10" fill="#334155">quantity, condition</text>
  <text x="488" y="303" font-size="10" fill="#334155">ownerClubId</text>
  <text x="640" y="303" font-size="9" fill="#db2777" text-anchor="end">FK</text>
  <text x="488" y="319" font-size="10" fill="#334155">status</text>
  <text x="640" y="319" font-size="9" fill="#ca8a04" text-anchor="end">ENUM</text>
  <text x="488" y="338" font-size="9" fill="#64748b">format EQP001, EQP002, ...</text>

  <!-- BOOKING -->
  <rect x="215" y="400" width="270" height="180" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <rect x="215" y="400" width="270" height="24" rx="4" fill="#2563eb"/>
  <text x="350" y="417" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">BOOKING  (bookings.csv)</text>
  <text x="223" y="440" font-size="10" font-weight="bold" fill="#0f172a">bookingId</text>
  <text x="445" y="440" font-size="9" fill="#2563eb" text-anchor="end">PK</text>
  <text x="223" y="456" font-size="10" fill="#334155">memberId</text>
  <text x="445" y="456" font-size="9" fill="#db2777" text-anchor="end">FK</text>
  <text x="223" y="472" font-size="10" fill="#334155">equipmentId</text>
  <text x="445" y="472" font-size="9" fill="#db2777" text-anchor="end">FK</text>
  <text x="223" y="488" font-size="10" fill="#334155">clubId</text>
  <text x="445" y="488" font-size="9" fill="#db2777" text-anchor="end">FK</text>
  <text x="223" y="504" font-size="10" fill="#334155">startDate, expectedReturnDate</text>
  <text x="223" y="520" font-size="10" fill="#334155">actualReturnDate</text>
  <text x="445" y="520" font-size="9" fill="#64748b" text-anchor="end">NONE until returned</text>
  <text x="223" y="536" font-size="10" fill="#334155">purpose, createdAt</text>
  <text x="223" y="552" font-size="10" fill="#334155">status</text>
  <text x="445" y="552" font-size="9" fill="#ca8a04" text-anchor="end">ENUM</text>
  <text x="223" y="568" font-size="10" fill="#334155">returnCondition, damageNotes</text>

  <!-- MAINTENANCE -->
  <rect x="490" y="420" width="195" height="116" rx="4" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/>
  <rect x="490" y="420" width="195" height="24" rx="4" fill="#db2777"/>
  <text x="587" y="437" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">MAINTENANCE_RECORD</text>
  <text x="498" y="460" font-size="10" font-weight="bold" fill="#0f172a">recordId</text>
  <text x="675" y="460" font-size="9" fill="#2563eb" text-anchor="end">PK</text>
  <text x="498" y="476" font-size="10" fill="#334155">equipmentId</text>
  <text x="675" y="476" font-size="9" fill="#db2777" text-anchor="end">FK</text>
  <text x="498" y="492" font-size="10" fill="#334155">recordDate</text>
  <text x="498" y="508" font-size="10" fill="#334155">action</text>
  <text x="498" y="524" font-size="10" fill="#334155">notes</text>

  <!-- Relationships -->
  <!-- Club -> Member -->
  <line x1="265" y1="138" x2="120" y2="213" stroke="#475569" stroke-width="1.4"/>
  <text x="258" y="150" font-size="10" font-weight="bold" fill="#475569">1</text>
  <text x="128" y="207" font-size="10" font-weight="bold" fill="#475569">N</text>
  <text x="140" y="172" font-size="9.5" fill="#475569" transform="rotate(-27 140 172)">has members</text>

  <!-- Club -> Equipment -->
  <line x1="435" y1="138" x2="580" y2="213" stroke="#475569" stroke-width="1.4"/>
  <text x="438" y="150" font-size="10" font-weight="bold" fill="#475569">1</text>
  <text x="562" y="207" font-size="10" font-weight="bold" fill="#475569">N</text>
  <text x="470" y="170" font-size="9.5" fill="#475569" transform="rotate(27 470 170)">owns</text>

  <!-- Club -> Booking -->
  <line x1="350" y1="138" x2="350" y2="398" stroke="#475569" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="356" y="152" font-size="10" font-weight="bold" fill="#475569">1</text>
  <text x="356" y="392" font-size="10" font-weight="bold" fill="#475569">N</text>
  <text x="356" y="280" font-size="9.5" fill="#475569">booked on behalf of</text>

  <!-- Member -> Booking -->
  <line x1="120" y1="347" x2="245" y2="428" stroke="#475569" stroke-width="1.4"/>
  <text x="114" y="360" font-size="10" font-weight="bold" fill="#475569">1</text>
  <text x="232" y="424" font-size="10" font-weight="bold" fill="#475569">N</text>
  <text x="140" y="398" font-size="9.5" fill="#475569" transform="rotate(33 140 398)">makes</text>

  <!-- Equipment -> Booking -->
  <line x1="530" y1="347" x2="450" y2="428" stroke="#475569" stroke-width="1.4"/>
  <text x="534" y="360" font-size="10" font-weight="bold" fill="#475569">1</text>
  <text x="456" y="422" font-size="10" font-weight="bold" fill="#475569">N</text>
  <text x="452" y="390" font-size="9.5" fill="#475569" transform="rotate(-45 452 390)">reserved in</text>

  <!-- Equipment -> Maintenance -->
  <line x1="620" y1="347" x2="600" y2="418" stroke="#475569" stroke-width="1.4"/>
  <text x="624" y="360" font-size="10" font-weight="bold" fill="#475569">1</text>
  <text x="606" y="414" font-size="10" font-weight="bold" fill="#475569">N</text>
  <text x="626" y="392" font-size="9.5" fill="#475569">has history</text>

  <text x="350" y="605" font-size="10" text-anchor="middle" fill="#64748b">Each CSV file behaves like a table: column 1 is the primary key and the ID columns act as foreign keys</text>
</svg>
