<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" width="700" height="760" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="760" fill="#ffffff"/>
  <defs>
    <marker id="w" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Start -->
  <ellipse cx="250" cy="28" rx="62" ry="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="250" y="33" font-size="12" text-anchor="middle" fill="#14532d">Start booking</text>
  <line x1="250" y1="46" x2="250" y2="66" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>

  <!-- Decision 1 -->
  <polygon points="250,68 360,105 250,142 140,105" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="101" font-size="11" text-anchor="middle" fill="#1e3a8a">Member and equipment</text>
  <text x="250" y="115" font-size="11" text-anchor="middle" fill="#1e3a8a">IDs exist?</text>
  <line x1="360" y1="105" x2="480" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="400" y="98" font-size="10" fill="#b91c1c">No</text>
  <line x1="250" y1="142" x2="250" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="258" y="158" font-size="10" fill="#15803d">Yes</text>

  <!-- Decision 2 -->
  <polygon points="250,164 360,201 250,238 140,201" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="197" font-size="11" text-anchor="middle" fill="#1e3a8a">Equipment DAMAGED or</text>
  <text x="250" y="211" font-size="11" text-anchor="middle" fill="#1e3a8a">UNDER_MAINTENANCE?</text>
  <line x1="360" y1="201" x2="480" y2="201" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="400" y="194" font-size="10" fill="#b91c1c">Yes</text>
  <line x1="250" y1="238" x2="250" y2="258" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="258" y="254" font-size="10" fill="#15803d">No</text>

  <!-- Decision 3 -->
  <polygon points="250,260 360,297 250,334 140,297" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="293" font-size="11" text-anchor="middle" fill="#1e3a8a">Return date earlier</text>
  <text x="250" y="307" font-size="11" text-anchor="middle" fill="#1e3a8a">than start date?</text>
  <line x1="360" y1="297" x2="480" y2="297" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="400" y="290" font-size="10" fill="#b91c1c">Yes</text>
  <line x1="250" y1="334" x2="250" y2="354" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="258" y="350" font-size="10" fill="#15803d">No</text>

  <!-- Decision 4 -->
  <polygon points="250,356 360,393 250,430 140,393" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="389" font-size="11" text-anchor="middle" fill="#1e3a8a">Dates overlap a live</text>
  <text x="250" y="403" font-size="11" text-anchor="middle" fill="#1e3a8a">booking of the same item?</text>
  <line x1="360" y1="393" x2="480" y2="393" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="400" y="386" font-size="10" fill="#b91c1c">Yes</text>
  <line x1="250" y1="430" x2="250" y2="450" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="258" y="446" font-size="10" fill="#15803d">No</text>

  <!-- Error box -->
  <rect x="480" y="80" width="190" height="340" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="575" y="230" font-size="13" font-weight="bold" text-anchor="middle" fill="#991b1b">Show specific error</text>
  <text x="575" y="250" font-size="11" text-anchor="middle" fill="#7f1d1d">no booking is created</text>
  <text x="575" y="268" font-size="11" text-anchor="middle" fill="#7f1d1d">return to main menu</text>
  <text x="575" y="290" font-size="10" text-anchor="middle" fill="#334155">program keeps running</text>

  <!-- REQUESTED -->
  <rect x="145" y="452" width="210" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="472" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Booking created</text>
  <text x="250" y="488" font-size="11" text-anchor="middle" fill="#334155">status = REQUESTED</text>

  <line x1="250" y1="496" x2="250" y2="522" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="258" y="514" font-size="10" fill="#475569">option 8: approve</text>

  <!-- APPROVED -->
  <rect x="145" y="524" width="210" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="549" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">status = APPROVED</text>

  <!-- Cancel branch -->
  <line x1="145" y1="474" x2="60" y2="474" stroke="#475569" stroke-width="1.5"/>
  <line x1="60" y1="474" x2="60" y2="600" stroke="#475569" stroke-width="1.5"/>
  <line x1="145" y1="544" x2="60" y2="544" stroke="#475569" stroke-width="1.5"/>
  <line x1="60" y1="600" x2="88" y2="600" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="66" y="510" font-size="10" fill="#475569">option 9</text>
  <text x="66" y="522" font-size="10" fill="#475569">cancel</text>
  <rect x="90" y="582" width="110" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="145" y="600" font-size="11" font-weight="bold" text-anchor="middle" fill="#7f1d1d">CANCELLED</text>
  <text x="145" y="613" font-size="9" text-anchor="middle" fill="#7f1d1d">item released</text>

  <line x1="250" y1="564" x2="250" y2="590" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="258" y="582" font-size="10" fill="#475569">option 10: issue</text>

  <!-- ACTIVE -->
  <rect x="215" y="592" width="230" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="612" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">status = ACTIVE</text>
  <text x="330" y="628" font-size="10" text-anchor="middle" fill="#334155">equipment = BOOKED</text>

  <!-- Overdue -->
  <rect x="470" y="592" width="200" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="570" y="612" font-size="12" font-weight="bold" text-anchor="middle" fill="#7c2d12">status = OVERDUE</text>
  <text x="570" y="628" font-size="10" text-anchor="middle" fill="#334155">detected automatically</text>
  <line x1="445" y1="614" x2="468" y2="614" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="467" y="586" font-size="9" fill="#ea580c" text-anchor="end">due date passed</text>

  <line x1="330" y1="636" x2="330" y2="664" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="338" y="656" font-size="10" fill="#475569">option 11: return</text>
  <line x1="570" y1="636" x2="570" y2="664" stroke="#475569" stroke-width="1.5"/>
  <line x1="570" y1="664" x2="420" y2="664" stroke="#475569" stroke-width="1.5"/>

  <!-- Return outcomes -->
  <rect x="50" y="666" width="180" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="686" font-size="11" font-weight="bold" text-anchor="middle" fill="#14532d">RETURNED — good</text>
  <text x="140" y="701" font-size="10" text-anchor="middle" fill="#334155">equipment = AVAILABLE</text>
  <text x="140" y="715" font-size="10" text-anchor="middle" fill="#334155">free to book again</text>

  <rect x="245" y="666" width="180" height="58" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="335" y="686" font-size="11" font-weight="bold" text-anchor="middle" fill="#7f1d1d">RETURNED — damaged</text>
  <text x="335" y="701" font-size="10" text-anchor="middle" fill="#334155">equipment = DAMAGED</text>
  <text x="335" y="715" font-size="10" text-anchor="middle" fill="#334155">maintenance record added</text>

  <rect x="440" y="666" width="200" height="58" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="540" y="686" font-size="11" font-weight="bold" text-anchor="middle" fill="#713f12">RETURNED — needs service</text>
  <text x="540" y="701" font-size="10" text-anchor="middle" fill="#334155">equipment = UNDER_MAINTENANCE</text>
  <text x="540" y="715" font-size="10" text-anchor="middle" fill="#334155">option 12 makes it available</text>

  <line x1="330" y1="664" x2="140" y2="664" stroke="#475569" stroke-width="1.5"/>
  <line x1="140" y1="664" x2="140" y2="664" stroke="#475569" stroke-width="1.5"/>
  <line x1="140" y1="655" x2="140" y2="664" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <line x1="335" y1="655" x2="335" y2="664" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <line x1="540" y1="655" x2="540" y2="664" stroke="#475569" stroke-width="1.5" marker-end="url(#w)"/>
  <line x1="140" y1="655" x2="540" y2="655" stroke="#475569" stroke-width="1.5"/>
  <text x="150" y="650" font-size="9" fill="#475569">condition chosen at return time</text>

  <text x="350" y="748" font-size="10" text-anchor="middle" fill="#64748b">Only RETURNED and CANCELLED bookings release the equipment (business rule 10)</text>
</svg>
